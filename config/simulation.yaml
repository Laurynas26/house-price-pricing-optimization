# Thin vertical slice parameters.
#
# EVERY VALUE HERE IS CRUDE ON PURPOSE.
#
# The build order is deliberately sweep-first: get one rough pipeline running
# end-to-end, sweep the parameters, and spend precision only where the sweep shows
# the answer actually moves. Investing in an elaborate CBS-derived equity
# construction before knowing whether equity drives the result would be exactly the
# premature precision this project is meant to argue against.
#
# Each parameter is labelled DERIVED or ASSUMED. That labelling is load-bearing:
# the deliverable is a sensitivity result, and a reader must be able to tell which
# inputs come from somewhere and which are stipulated.

budget:
  # ASSUMED (crude stand-in for NIBUD/AFM loan-to-income norms).
  # Dutch maximum borrowing is a published formula keyed to income and interest
  # rate. A flat multiple is a placeholder until the sweep says whether it matters.
  lti_multiple: 5.0

  # ASSUMED. Household income distribution for Amsterdam buyers, lognormal.
  # Buyers are movers and first-time buyers, NOT the resident population — CBS
  # resident income would be the wrong reference even if we used it.
  income_median_eur: 75000
  income_sigma_log: 0.55

  # Equity is now DERIVED, not assumed. config/equity_function.yaml is generated by
  # scripts/derive_equity_from_cbs.py from CBS tables 83834NED and 86160NED, and
  # gives deployable equity in EUR by income decile:
  #   decile 1  EUR   275,372
  #   decile 5  EUR   224,679
  #   decile 10 EUR 1,176,096   (after the Amsterdam tail correction)
  #
  # This parameter scales that schedule for sensitivity analysis only. 1.0 is the
  # derived central case. The schedule itself is never hand-edited: equity has enough
  # leverage that any segment can be made to clear by handing its buyers more of it,
  # and tuning it would calibrate the demand side to reproduce the prices the project
  # is trying to explain. If the top of the market does not clear at 1.0, that is a
  # result about who buys Amsterdam property, not a parameter to fix.
  equity_multiplier: 1.0

  # DERIVED from Dutch tax policy.
  # Transfer tax is 2% for owner-occupiers; qualifying first-time buyers below a
  # price cap pay nothing (startersvrijstelling). Notary, appraisal and advice
  # fees are additional and must come from own funds. Segment-varying by policy
  # rather than by assumption, which is why it is worth keeping.
  transfer_tax_rate: 0.02
  starters_exemption_price_cap: 525000
  starters_share_of_buyers: 0.35
  fixed_costs_eur: 4000

demand:
  # ASSUMED, from literature. The quantity the whole project sweeps.
  # Values bracket the range used in the housing demand literature.
  elasticity_baseline: -0.65

  # Buyers arriving per simulated day, across the whole market.
  # ASSUMED. Controls market thickness and therefore bidder counts.
  arrivals_per_day: 260

  # Preference filters. ASSUMED, and underivable from this data — Funda shows the
  # supply side only. We observe what sellers listed, never what buyers chose or
  # rejected, and sold/withdrawn status was never scraped. A discrete choice model
  # is the standard instrument for preferences and it needs choice data that does
  # not exist here.
  size_tolerance_frac: 0.45
  max_distance_km: 12.0

market:
  horizon_days: 90

  # Time cost switches, independent so the strategy comparison is itself a
  # sensitivity result rather than one hardcoded mechanism.
  # Without at least one of these active, waiting is free, revenue-max trivially
  # dominates speed-max, and the central comparison has a predetermined winner.
  discount_rate_annual: 0.06      # ASSUMED
  carrying_cost_monthly_eur: 0    # ASSUMED; VvE data available for 65.6% of pool
  buyer_pool_decay_daily: 0.0     # ASSUMED; stale listings attract fewer viewers

optimizer:
  # Grid search over asking price as a multiple of the seller's estimated value.
  # Deliberately NOT a MIP yet: building solver machinery before knowing whether
  # the objective surface needs it would be premature investment.
  # Grid bounds were widened twice, both times because the optimum was landing on an
  # edge — a censored solution, not a solved one. Any "how far does the price move"
  # figure computed against a binding edge measures the grid, not the model.
  #
  # The ceiling bound at inelastic settings, where the optimizer wants a high price.
  # The floor bound everywhere, for a different reason: the grid is a multiple of
  # v_est, the seller's noisy estimate. Where v_est sits far above v_true, even the
  # lowest multiple of it is still overpriced, so the optimum is pinned. The floor
  # therefore has to span the valuation-error distribution, which reaches nearly
  # +/-40% in the XL band, not just the plausible pricing range.
  price_multiple_min: 0.50
  price_multiple_max: 2.00
  price_multiple_steps: 76

valuation:
  # DERIVED from the prediction project's held-out residuals.
  # V_true is anchored at the asking price; V_est is what the seller and optimizer
  # see, drawn as V_true * (1 + eps) with eps bootstrapped within size band.
  #
  # Bootstrapped from the 820-listing OVERLAP between the audit's 860 held-out
  # rows and this pool — not all 860. The 40 non-overlapping rows are records the
  # prediction pipeline imputed and this pool drops; their errors are atypical, and
  # including them inflated the M band from 9.5% to 12.7% (a 34% overstatement).
  use_overlap_only: true

sweep:
  elasticity_values: [-0.25, -0.45, -0.65, -0.85, -1.05]

  # Multipliers on the CBS-derived equity schedule. 1.0 is the derived case; the
  # others bracket it to show how much the answer depends on the derivation.
  equity_multiplier_values: [0.0, 0.5, 1.0, 1.5, 2.5]
  n_property_sample: 400   # sample the pool for sweep runtime
  seed: 42
