  definition: deployable equity = eigen woning - hypotheekschuld eigen woning + financiele
    bezittingen. Business assets, other real estate and substantial holdings are excluded
    as not deployable into a purchase.
  conditioning: Income decile only. CBS KenmerkenVanHuishoudens is a set of marginals,
    not a cross-tabulation, so owner-occupier status cannot be crossed with income
    decile in this table.
  transfer_assumption: Amsterdam is materially more skewed (mean/median 10.55 vs 2.46
    nationally), so a pure level shift of the national shape understates its top tail.
    The level anchor is applied but is a LOWER BOUND at the top of the market.
  standing_rule: This function is DERIVED and must never be adjusted to make a market
    segment clear. Failure of the top segment to clear is a result, not a calibration
    error.
  ordering_disclosure: The sensitivity sweep was run before this derivation, so the
    equity level that clears the top bin was known when this was written. The derivation
    uses no simulation input, but a reader should weigh the ordering.
